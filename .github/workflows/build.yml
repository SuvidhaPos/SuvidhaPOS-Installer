name: Build SuvidhaPos-Installer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Install .NET 8 SDK
      # ---------------------------------------------------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ---------------------------------------------------------
      # 3. Check required project files
      # ---------------------------------------------------------
      - name: Verify project files
        shell: pwsh
        run: |
          $required = @(
            "SuvidhaPos-Installer.sln",
            "Installer/SuvidhaPos-Installer.csproj",
            "Installer/MainForm.cs",
            "Installer/Program.cs",
            "Installer/app.manifest",
            "Installer/SuvidhaPos-Installer.iss",
            "Assets/SuvidhaPOS.ico",
            "Assets/SuvidhaPOS.png",
            "Assets/WizardImage.bmp",
            "Assets/WizardSmallImage.bmp",
            "docs/TermsAndConditions.txt",
            "build.ps1"
          )

          $missing = @()

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              $missing += $file
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "MISSING REQUIRED FILES"
            Write-Host "========================================"

            foreach ($file in $missing) {
              Write-Host "MISSING: $file"
            }

            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "ALL REQUIRED FILES FOUND"
          Write-Host "========================================"


      # ---------------------------------------------------------
      # 4. Restore
      # ---------------------------------------------------------
      - name: Restore .NET project
        shell: pwsh
        run: |
          dotnet restore `
            "Installer/SuvidhaPos-Installer.csproj" `
            --runtime win-x64


      # ---------------------------------------------------------
      # 5. Build
      # ---------------------------------------------------------
      - name: Build application
        shell: pwsh
        run: |
          dotnet build `
            "Installer/SuvidhaPos-Installer.csproj" `
            --configuration Release `
            --framework net8.0-windows `
            --runtime win-x64 `
            --no-restore


      # ---------------------------------------------------------
      # 6. Publish
      #
      # IMPORTANT:
      # Single-file publish intentionally disabled.
      # This avoids the previous Windows 14001 startup problem.
      # ---------------------------------------------------------
      - name: Publish Windows x64 application
        shell: pwsh
        run: |

          if (Test-Path "publish") {
            Remove-Item "publish" -Recurse -Force
          }

          dotnet publish `
            "Installer/SuvidhaPos-Installer.csproj" `
            --configuration Release `
            --framework net8.0-windows `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "publish" `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=false

          if (-not (Test-Path "publish/SuvidhaPos-Installer.exe")) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "PUBLISHED EXE NOT FOUND"
            Write-Host "========================================"

            Get-ChildItem "publish" -Recurse

            exit 1
          }

          Write-Host "Published EXE found."


      # ---------------------------------------------------------
      # 7. Verify logo/assets
      # ---------------------------------------------------------
      - name: Verify installer assets
        shell: pwsh
        run: |

          $assets = @(
            "Assets/SuvidhaPOS.ico",
            "Assets/SuvidhaPOS.png"
          )

          foreach ($asset in $assets) {

            if (-not (Test-Path "publish/$asset")) {
              Write-Host "Missing published asset: $asset"
              exit 1
            }

            Write-Host "Verified: publish/$asset"
          }


      # ---------------------------------------------------------
      # 8. Install Inno Setup
      # ---------------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y


      # ---------------------------------------------------------
      # 9. Build final Setup EXE
      # ---------------------------------------------------------
      - name: Build final installer
        shell: pwsh
        run: |

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup compiler not found."
            exit 1
          }

          if (Test-Path "release") {
            Remove-Item "release" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "release" `
            -Force | Out-Null

          & $iscc "Installer/SuvidhaPos-Installer.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "INNO SETUP BUILD FAILED"
            Write-Host "========================================"

            exit $LASTEXITCODE
          }


      # ---------------------------------------------------------
      # 10. Verify final Setup
      # ---------------------------------------------------------
      - name: Verify final installer
        shell: pwsh
        run: |

          $setup = "release/SuvidhaPOS-Installer-Setup.exe"

          if (-not (Test-Path $setup)) {

            Write-Host ""
            Write-Host "========================================"
            Write-Host "FINAL INSTALLER NOT FOUND"
            Write-Host "========================================"

            Get-ChildItem "release" -Recurse -ErrorAction SilentlyContinue

            exit 1
          }

          $size = (Get-Item $setup).Length

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "========================================"

          Write-Host "File:"
          Write-Host $setup

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$([math]::Round($size / 1MB, 2)) MB"


      # ---------------------------------------------------------
      # 11. Upload final installer
      # ---------------------------------------------------------
      - name: Upload final installer
        uses: actions/upload-artifact@v4
        with:
          name: SuvidhaPos-Installer-Windows-x64
          path: release/SuvidhaPOS-Installer-Setup.exe
          if-no-files-found: error
          retention-days: 14


      # ---------------------------------------------------------
      # 12. Upload published application folder
      # ---------------------------------------------------------
      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: SuvidhaPos-Installer-App-Folder
          path: publish/
          if-no-files-found: error
          retention-days: 14
