name: Build SuvidhaPos-Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify project files
        shell: pwsh
        run: |
          $required = @(
            "SuvidhaPos-Installer.sln",
            "Installer/SuvidhaPos-Installer.csproj",
            "Installer/MainForm.cs",
            "Installer/Program.cs",
            "Installer/app.manifest",
            "Installer/SuvidhaPos-Installer.iss",
            "Assets/SuvidhaPOS.ico",
            "Assets/SuvidhaPOS.png",
            "Assets/WizardImage.bmp",
            "Assets/WizardSmallImage.bmp",
            "docs/TermsAndConditions.txt",
            "build.ps1",
            "tools/ApplyInstallFlowFix.ps1",
            "tools/ApplyInstallerUiFix.ps1"
          )
          $missing = @()
          foreach ($file in $required) { if (-not (Test-Path $file)) { $missing += $file } }
          if ($missing.Count -gt 0) {
            Write-Host "MISSING REQUIRED FILES"
            $missing | ForEach-Object { Write-Host "MISSING: $_" }
            exit 1
          }
          Write-Host "ALL REQUIRED FILES FOUND"

      - name: Apply installer flow fix
        shell: pwsh
        run: .\tools\ApplyInstallFlowFix.ps1

      - name: Apply stable responsive UI fix
        shell: pwsh
        run: .\tools\ApplyInstallerUiFix.ps1

      - name: Restore .NET project
        shell: pwsh
        run: dotnet restore "Installer/SuvidhaPos-Installer.csproj" --runtime win-x64

      - name: Build application
        shell: pwsh
        run: |
          dotnet build `
            "Installer/SuvidhaPos-Installer.csproj" `
            --configuration Release `
            --framework net8.0-windows `
            --runtime win-x64 `
            --no-restore

      - name: Publish Windows x64 application
        shell: pwsh
        run: |
          if (Test-Path "publish") { Remove-Item "publish" -Recurse -Force }
          dotnet publish `
            "Installer/SuvidhaPos-Installer.csproj" `
            --configuration Release `
            --framework net8.0-windows `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output "publish" `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:EnableCompressionInSingleFile=false

          if (-not (Test-Path "publish/SuvidhaPos-Installer.exe")) {
            Get-ChildItem "publish" -Recurse
            exit 1
          }

      - name: Verify installer assets
        shell: pwsh
        run: |
          foreach ($asset in @("Assets/SuvidhaPOS.ico", "Assets/SuvidhaPOS.png")) {
            if (-not (Test-Path "publish/$asset")) { throw "Missing published asset: $asset" }
            Write-Host "Verified: publish/$asset"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build final Setup EXE
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          if (Test-Path "release") { Remove-Item "release" -Recurse -Force }
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          & $iscc "Installer/SuvidhaPos-Installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify final installer
        shell: pwsh
        run: |
          $setup = "release/SuvidhaPOS-Installer-Setup.exe"
          if (-not (Test-Path $setup)) { Get-ChildItem "release" -Recurse; exit 1 }
          $size = (Get-Item $setup).Length
          Write-Host "BUILD SUCCESSFUL: $setup ($([math]::Round($size / 1MB, 2)) MB)"

      - name: Upload final installer
        uses: actions/upload-artifact@v4
        with:
          name: SuvidhaPos-Installer-Windows-x64
          path: release/SuvidhaPOS-Installer-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: SuvidhaPos-Installer-App-Folder
          path: publish/
          if-no-files-found: error
          retention-days: 14
