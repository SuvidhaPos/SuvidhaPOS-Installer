name: Apply reference installer UI

on:
  push:
    branches:
      - ui/reference-design-2026-08-21

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: |
          $raw = [Convert]::FromBase64String((Get-Content ui-reference.patch.b64 -Raw))
          [IO.File]::WriteAllBytes('ui.patch.gz', $raw)
          python -c "import gzip,pathlib; p=pathlib.Path('ui.patch.gz'); pathlib.Path('ui.patch').write_bytes(gzip.decompress(p.read_bytes()))"
          git apply --check ui.patch
          git apply ui.patch
      - name: Build
        shell: pwsh
        run: dotnet build Installer/SuvidhaPos-Installer.csproj --configuration Release --no-restore
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Installer/MainForm.cs
          git rm -f ui-reference.patch.b64 .github/workflows/apply-reference-ui.yml
          git commit -m "feat: apply reference installer UI"
          git push origin HEAD:${{ github.ref_name }}
